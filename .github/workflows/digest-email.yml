name: Monday digest email

on:
  # Normally sent the moment Monday's ingest finishes, so the email always has that morning's data
  # (GitHub can start the 00:30 UTC ingest 40+ minutes late). The 02:30 UTC (08:00 IST) schedule is
  # a fallback if the ingest failed; the email is sent once per ISO week either way.
  workflow_run:
    workflows: ["Ingest"]
    types: [completed]
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch: {}

jobs:
  email:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send the Monday digest (once per ISO week)
        # After an ingest, only on Mondays (UTC); the schedule and manual runs always try.
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "$(date -u +%u)" != "1" ]; then echo "not Monday: nothing to send"; exit 0; fi
          npm run notify -- --digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NOTIFY_TO: ${{ vars.NOTIFY_TO }}
          NOTIFY_SMTP_USER: ${{ secrets.NOTIFY_SMTP_USER || secrets.INTAKE_IMAP_USER }}
          NOTIFY_SMTP_PASSWORD: ${{ secrets.NOTIFY_SMTP_PASSWORD || secrets.INTAKE_IMAP_PASSWORD }}
