name: Ingest

on:
  schedule:
    # 00:30 UTC = 06:00 IST daily, so Monday's digest is fresh before 07:00 IST.
    - cron: "30 0 * * *"
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # The AI steps stop starting new work after INGEST_BUDGET_MIN (30) and leave the rest for the next
    # run, so scoring, alerts and the cache refresh always finish well inside this limit. A hang still
    # stops here instead of blocking the next runs (concurrency group "ingest").
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Run pipeline
        run: npm run ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_KEY_PRIMARY: ${{ secrets.GEMINI_KEY_PRIMARY }}
          GEMINI_KEY_FALLBACK_1: ${{ secrets.GEMINI_KEY_FALLBACK_1 }}
          GEMINI_KEY_FALLBACK_2: ${{ secrets.GEMINI_KEY_FALLBACK_2 }}
          GEMINI_KEY_FALLBACK_3: ${{ secrets.GEMINI_KEY_FALLBACK_3 }}
          MAX_CLASSIFY_PER_RUN: ${{ vars.MAX_CLASSIFY_PER_RUN || '60' }}
          INGEST_BUDGET_MIN: ${{ vars.INGEST_BUDGET_MIN || '30' }}
          CLASSIFY_CONCURRENCY: ${{ vars.CLASSIFY_CONCURRENCY || '3' }}
          # Intake inbox (Google Alerts, LinkedIn emails, forwarded messages). Optional until set.
          INTAKE_IMAP_USER: ${{ secrets.INTAKE_IMAP_USER }}
          INTAKE_IMAP_PASSWORD: ${{ secrets.INTAKE_IMAP_PASSWORD }}
          INTAKE_MAILBOX: ${{ vars.INTAKE_MAILBOX || 'INBOX' }}
          INTAKE_FILTER: ${{ vars.INTAKE_FILTER || 'tagged' }}
      - name: Warm window (12-month CSR news archives, incremental)
        run: npm run history:recent
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_KEY_PRIMARY: ${{ secrets.GEMINI_KEY_PRIMARY }}
          GEMINI_KEY_FALLBACK_1: ${{ secrets.GEMINI_KEY_FALLBACK_1 }}
          GEMINI_KEY_FALLBACK_2: ${{ secrets.GEMINI_KEY_FALLBACK_2 }}
          GEMINI_KEY_FALLBACK_3: ${{ secrets.GEMINI_KEY_FALLBACK_3 }}
      - name: Regulatory highlight summary
        run: npm run regulatory
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_KEY_PRIMARY: ${{ secrets.GEMINI_KEY_PRIMARY }}
          GEMINI_KEY_FALLBACK_1: ${{ secrets.GEMINI_KEY_FALLBACK_1 }}
          GEMINI_KEY_FALLBACK_2: ${{ secrets.GEMINI_KEY_FALLBACK_2 }}
          GEMINI_KEY_FALLBACK_3: ${{ secrets.GEMINI_KEY_FALLBACK_3 }}
      - name: Relationship watch (existing funders)
        run: npm run relationships
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_KEY_PRIMARY: ${{ secrets.GEMINI_KEY_PRIMARY }}
          GEMINI_KEY_FALLBACK_1: ${{ secrets.GEMINI_KEY_FALLBACK_1 }}
          GEMINI_KEY_FALLBACK_2: ${{ secrets.GEMINI_KEY_FALLBACK_2 }}
          GEMINI_KEY_FALLBACK_3: ${{ secrets.GEMINI_KEY_FALLBACK_3 }}
      # Publish the day's digest and alerts before the slow, optional enrichment steps below, so a
      # slow pitch-kit or community run can never hold up the data. Both run again at the end.
      - name: Instant alert for new Call-this-week items (early)
        run: npm run notify -- --alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NOTIFY_TO: ${{ vars.NOTIFY_TO }}
          NOTIFY_SMTP_USER: ${{ secrets.NOTIFY_SMTP_USER || secrets.INTAKE_IMAP_USER }}
          NOTIFY_SMTP_PASSWORD: ${{ secrets.NOTIFY_SMTP_PASSWORD || secrets.INTAKE_IMAP_PASSWORD }}
      - name: Refresh site cache (early)
        run: '[ -z "$REVALIDATE_SECRET" ] || curl -fsS -X POST "${{ vars.SITE_URL || ''https://csr-partnership-radar-two.vercel.app'' }}/api/revalidate" -H "x-revalidate-secret: $REVALIDATE_SECRET" || true'
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      - name: Pitch kits (sourced wants, news, proof for likely contacts)
        run: npm run pitch
        continue-on-error: true
        timeout-minutes: 10
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_KEY_PRIMARY: ${{ secrets.GEMINI_KEY_PRIMARY }}
          GEMINI_KEY_FALLBACK_1: ${{ secrets.GEMINI_KEY_FALLBACK_1 }}
          GEMINI_KEY_FALLBACK_2: ${{ secrets.GEMINI_KEY_FALLBACK_2 }}
          GEMINI_KEY_FALLBACK_3: ${{ secrets.GEMINI_KEY_FALLBACK_3 }}
      - name: Community builder (people publicly named in new CSR items)
        run: npm run contacts
        continue-on-error: true
        timeout-minutes: 10
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_KEY_PRIMARY: ${{ secrets.GEMINI_KEY_PRIMARY }}
          GEMINI_KEY_FALLBACK_1: ${{ secrets.GEMINI_KEY_FALLBACK_1 }}
          GEMINI_KEY_FALLBACK_2: ${{ secrets.GEMINI_KEY_FALLBACK_2 }}
          GEMINI_KEY_FALLBACK_3: ${{ secrets.GEMINI_KEY_FALLBACK_3 }}
      - name: Re-check CSR job links (closed or empty postings drop to "check link" or out)
        run: npm run jobs:validate
        continue-on-error: true
        timeout-minutes: 5
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Data-quality audit (merge duplicate companies, check cited sources)
        run: npm run audit
        continue-on-error: true
        timeout-minutes: 8
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_KEY_PRIMARY: ${{ secrets.GEMINI_KEY_PRIMARY }}
          GEMINI_KEY_FALLBACK_1: ${{ secrets.GEMINI_KEY_FALLBACK_1 }}
          GEMINI_KEY_FALLBACK_2: ${{ secrets.GEMINI_KEY_FALLBACK_2 }}
          GEMINI_KEY_FALLBACK_3: ${{ secrets.GEMINI_KEY_FALLBACK_3 }}
      - name: Refresh company stats and forecasts
        run: npm run history:stats
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Instant alert for new Call-this-week items
        run: npm run notify -- --alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NOTIFY_TO: ${{ vars.NOTIFY_TO }}
          NOTIFY_SMTP_USER: ${{ secrets.NOTIFY_SMTP_USER || secrets.INTAKE_IMAP_USER }}
          NOTIFY_SMTP_PASSWORD: ${{ secrets.NOTIFY_SMTP_PASSWORD || secrets.INTAKE_IMAP_PASSWORD }}
      - name: Refresh site cache
        run: '[ -z "$REVALIDATE_SECRET" ] || curl -fsS -X POST "${{ vars.SITE_URL || ''https://csr-partnership-radar-two.vercel.app'' }}/api/revalidate" -H "x-revalidate-secret: $REVALIDATE_SECRET" || true'
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
